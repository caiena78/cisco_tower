plugin: netbox.netbox.nb_inventory
# api_endpoint and token are read from NETBOX_API / NETBOX_TOKEN (sourced from Vault)
validate_certs: True
config_context: False
cache: False
group_by:
  - device_roles
  - platforms
  - tenants
  - manufacturers
  - sites
  - tags
keyed_groups:
  - prefix: status
    key: status.value
  - prefix: tags
    key: tags.value
virtual_chassis_name: True
#query_filters:
#  - role: access-switch
# device_query_filters:
#   - has_primary_ip: 'true' # uncommenting this may cause duplicate devices to be created
#  - tenant__n: lcmc
compose:
  # ansible_host: comments
  netbox_id: id
  ansible_network_os: platform[0]
  comments: comments