---
# Lines are built to match `show running-config` text exactly (single spaces), so reruns report no change.
- name: Build IOS syslog lines
  ansible.builtin.set_fact:
    cisco_syslog_lines: >-
      {%- set l = ['logging origin-id hostname'] -%}
      {%- if cisco_syslog_src_if != 'NOT_SET' -%}
      {%- set _ = l.append('logging source-interface ' ~ cisco_syslog_src_if ~ ((' vrf ' ~ cisco_syslog_vrf) if cisco_syslog_vrf != 'NOT_SET' else '')) -%}
      {%- endif -%}
      {%- for s in cisco_syslog_servers_final -%}
      {# Fix: the VRF is now on the host line too (it was only on the source-interface) #}
      {%- set _ = l.append('logging host ' ~ s.ip ~ ((' vrf ' ~ cisco_syslog_vrf) if cisco_syslog_vrf != 'NOT_SET' else '') ~ ' transport ' ~ s.protocol ~ ' port ' ~ s.port) -%}
      {%- endfor -%}
      {%- set _ = l.append('logging trap ' ~ cisco_syslog_ios_levels[cisco_syslog.level | int]) -%}
      {{ l }}

- name: Reset syslog state
  ansible.builtin.set_fact:
    cisco_syslog_done: false

# IOS-XE with tcp/830 open: NETCONF first. datastore auto = candidate (+ commit) when the device
# advertises :candidate, otherwise running.
- name: Configure syslog over NETCONF
  when: network_transport == 'netconf'
  block:
    - name: Wait for NETCONF datastore lock
      ansible.builtin.include_role:
        name: network_facts
        tasks_from: wait_unlock.yml

    - name: Edit-config syslog (NETCONF)
      ansible.netcommon.netconf_config:
        content: "{{ lookup('ansible.builtin.template', 'netconf/ios_syslog.xml.j2') }}"
        datastore: auto
      vars:
        ansible_connection: ansible.netcommon.netconf
        ansible_host_key_checking: "{{ network_netconf_host_key_checking }}"
        ansible_network_os: default
        ansible_port: "{{ network_netconf_port }}"

    - name: Mark syslog done
      ansible.builtin.set_fact:
        cisco_syslog_done: true
  rescue:
    - name: NETCONF syslog failed
      ansible.builtin.fail:
        msg: "NETCONF syslog update failed and network_netconf_fallback_on_error is false: {{ ansible_failed_result.msg | default('') }}"
      when: not (network_netconf_fallback_on_error | bool)

    - name: Falling back to CLI for syslog
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: NETCONF syslog failed ({{ ansible_failed_result.msg | default('') | truncate(150) }}); using CLI"

- name: Configure syslog (IOS CLI)
  cisco.ios.ios_config:
    lines: "{{ cisco_syslog_lines }}"
    save_when: "{{ 'modified' if (network_save_config | bool) else 'never' }}"
  when: not cisco_syslog_done
