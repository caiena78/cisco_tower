---
# Shared helper: platform detection, NETCONF/CLI transport selection,
# NetBox site lookup and management interface/VRF detection.
# Replaces: netbox_getsite, get_mgnt_vrf, ansible_ios_get_mgnt_vrf, nxos_get_mgnt_vrf.

network_facts_debug: false
network_facts_netbox_enabled: true
network_facts_mgmt_enabled: true

# ios | nxos | aireos. Empty = detect from ansible_network_os.
network_platform_override: ""

# ---- Transport (NETCONF first, CLI fallback) ----
# auto    = probe tcp/830 + NETCONF session, fall back to CLI
# netconf = require NETCONF, fail the host if unusable
# cli     = never probe, always CLI
network_transport_preference: auto
network_netconf_port: 830
network_netconf_probe_timeout: 3
# NETCONF host keys are looked up per port ([host]:830), separately from the port 22 entry SSH/network_cli uses.
# false = do not verify (no known_hosts entry needed, set by choice for this fleet).
# true  = require one, e.g. ssh-keyscan -p 830 <host> >> ~/.ssh/known_hosts
network_netconf_host_key_checking: false
# If a NETCONF edit fails mid-run, redo that role's work over CLI
network_netconf_fallback_on_error: true
# IOS-XE: before a NETCONF edit, poll the datastore lock (over NETCONF) every interval seconds for up
# to retries times. If it is still locked afterwards and clear_lock is true, the holding session is
# ended with <kill-session>, falling back to CLI `clear configuration lock` if refused (a lock left by
# a stale yang_mgmt_infra session never frees itself). false = leave it and let the edit fail / fall
# back to CLI.
network_netconf_lock_retries: 6
network_netconf_lock_interval: 5
network_netconf_clear_lock: true
# Save running -> startup after NETCONF edits (NX-OS needs one CLI command for this)
network_save_config: false

# ---- NetBox (credentials come from env/Vault, no placeholders) ----
netbox_url: "{{ lookup('env', 'NETBOX_API') }}"
netbox_token: "{{ lookup('env', 'NETBOX_TOKEN') }}"
netbox_validate_certs: false
