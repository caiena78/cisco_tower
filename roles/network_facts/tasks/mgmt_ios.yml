---
# Management interface = the interface whose IP equals ansible_host; vrf_name = its vrf forwarding.
# Sets mgntINT / vrf_name (NOT_SET when not found) for compatibility with the old get_mgnt_vrf roles.
- name: Gather L3 interfaces (IOS)
  cisco.ios.ios_facts:
    gather_subset: min
    gather_network_resources: l3_interfaces

- name: Find the interface holding ansible_host
  ansible.builtin.set_fact:
    mgntINT: >-
      {%- set ns = namespace(n='NOT_SET') -%}
      {%- for i in (ansible_facts.network_resources.l3_interfaces | default([])) -%}
      {%- for a in (i.ipv4 | default([])) -%}
      {%- if (a.address | default('')).split(' ')[0].split('/')[0] == ansible_host -%}{%- set ns.n = i.name -%}{%- endif -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ ns.n }}
    vrf_name: NOT_SET

- name: Read VRF of the management interface
  cisco.ios.ios_command:
    commands:
      - "show running-config interface {{ mgntINT }}"
  register: network_facts_mgmt_cfg
  when: mgntINT != 'NOT_SET'

- name: Set vrf_name
  ansible.builtin.set_fact:
    vrf_name: >-
      {%- set m = (network_facts_mgmt_cfg.stdout[0] | default('')) | regex_findall('(?m)^\s*vrf forwarding (\S+)') -%}
      {{ (m | first) if (m | length > 0) else 'NOT_SET' }}
  when: mgntINT != 'NOT_SET'

- name: Show management interface
  ansible.builtin.debug:
    msg: "mgntINT={{ mgntINT }} vrf_name={{ vrf_name }}"
  when: network_facts_debug | bool
