---
# Cisco IOS / IOS-XE SNMPv3
# Views, groups, users and hosts: NETCONF first (IOS-XE, tcp/830 open), CLI fallback.
- name: Reset core SNMP state
  ansible.builtin.set_fact:
    cisco_snmp_core_done: false

- name: Configure SNMP core over NETCONF
  ansible.builtin.include_tasks: ios_netconf.yml
  when:
    - network_transport == 'netconf'
    - cisco_snmp_netconf_snmp_server | bool

- name: Configure SNMP core over CLI
  ansible.builtin.include_tasks: ios_core_cli.yml
  when: not cisco_snmp_core_done

# ---- v2c community ACL retrofit ----
- name: Get SNMP community config lines
  cisco.ios.ios_command:
    commands:
      - "show running-config | include ^snmp-server community"
  register: snmp_config

# Every RO/RW community is moved onto the management ACL (original ios_snmp behavior),
# replacing any older ACL. Communities already on the right ACL are skipped so reruns stay unchanged.
- name: Extract RO/RW communities not yet on the management ACL
  ansible.builtin.set_fact:
    snmp_communities: >-
      {{
        snmp_config.stdout_lines[0] | default([])
        | select('match', '^snmp-server community [^ ]+ (RO|RW)( |$)')
        | reject('match', '^snmp-server community [^ ]+ (RO|RW) ' ~ (cisco_snmp.acl.name | regex_escape) ~ '$')
        | map('regex_replace', '^snmp-server community ([^ ]+ (RO|RW)).*', '\\1')
        | list
      }}
  no_log: true

- name: Apply ACL to communities
  cisco.ios.ios_config:
    lines:
      - "snmp-server community {{ item }} {{ cisco_snmp.acl.name }}"
    match: none
  loop: "{{ snmp_communities }}"
  no_log: true
  when: snmp_communities | length > 0

# ---- Cleanup ----
- name: Cleanup stale SNMPv3 users and hosts
  when: cisco_snmp_cleanup | bool
  block:
    - name: Cleanup | Gather SNMP user and host lines
      cisco.ios.ios_command:
        commands:
          - "show running-config | include ^snmp-server user "
          - "show running-config | include ^snmp-server host "
      register: snmp_cfg_raw

    - name: Cleanup | Compute users to remove
      ansible.builtin.set_fact:
        snmp_user_lines: "{{ snmp_cfg_raw.stdout_lines[0] | default([]) }}"
        snmp_host_lines: "{{ snmp_cfg_raw.stdout_lines[1] | default([]) }}"
        snmp_users_to_remove: >-
          {{
            ((snmp_cfg_raw.stdout_lines[0] | default([]))
              | map('regex_replace', '^snmp-server user +([^ ]+).*', '\\1') | unique | list)
            | difference(cisco_snmp.users | map(attribute='username') | list)
            | difference(cisco_snmp_protected_users)
          }}

    - name: Cleanup | Show plan
      ansible.builtin.debug:
        msg: "SNMP users to remove: {{ snmp_users_to_remove }}"

    - name: Cleanup | Remove hosts then users
      when: snmp_users_to_remove | length > 0
      block:
        - name: Cleanup | Remove host lines of removed users
          cisco.ios.ios_config:
            lines: >-
              {{
                snmp_host_lines
                | select('search', ' (' ~ (snmp_users_to_remove | map('regex_escape') | join('|')) ~ ')$')
                | map('regex_replace', '^', 'no ')
                | list
              }}
            match: none

        - name: Cleanup | Remove user lines of removed users
          cisco.ios.ios_config:
            lines: >-
              {{
                snmp_user_lines
                | select('match', '^snmp-server user +(' ~ (snmp_users_to_remove | map('regex_escape') | join('|')) ~ ') ')
                | map('regex_replace', '^', 'no ')
                | list
              }}
            match: none

        - name: Cleanup | Verify
          cisco.ios.ios_command:
            commands:
              - "show running-config | include ^snmp-server user "
          register: snmp_verify

        - name: Cleanup | Fail if removed users remain
          ansible.builtin.fail:
            msg: "SNMP cleanup failed; still present: {{ remaining }}"
          vars:
            remaining: >-
              {{
                (snmp_verify.stdout_lines[0] | default([]))
                | select('match', '^snmp-server user +(' ~ (snmp_users_to_remove | map('regex_escape') | join('|')) ~ ') ')
                | list
              }}
          when: remaining | length > 0
