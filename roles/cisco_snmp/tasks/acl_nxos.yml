---
- name: Build NX-OS ACL lines
  ansible.builtin.set_fact:
    cisco_snmp_acl_lines: >-
      {{
        cisco_snmp_acl_ips
        | zip(range(10, (cisco_snmp_acl_ips | length * 10) + 1, 10))
        | map('reverse')
        | map('join', ' permit ip host ')
        | map('regex_replace', '$', ' any')
        | list
      }}

- name: Check if ACL exists
  cisco.nxos.nxos_command:
    commands: ["show running-config | include '^ip access-list '"]
  register: cisco_snmp_acl_check

# Exact-name match (the old substring include also matched MANAGEMENT_OLD)
- name: Remove ACL if it exists
  cisco.nxos.nxos_config:
    lines: ["no ip access-list {{ cisco_snmp_acl_def.name }}"]
  when: "('ip access-list ' ~ cisco_snmp_acl_def.name) in (cisco_snmp_acl_check.stdout_lines[0] | map('trim') | list)"
  ignore_errors: true

# One ACE per call. The config modules misbehave on ACLs of ~50+ lines when they are sent as one block.
- name: Add ACL entries one at a time
  cisco.nxos.nxos_config:
    parents: ["ip access-list {{ cisco_snmp_acl_def.name }}"]
    lines: ["{{ item }}"]
    match: line
    replace: line
  loop: "{{ cisco_snmp_acl_lines }}"
  loop_control:
    label: "{{ item }}"
